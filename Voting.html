
<!DOCTYPE html>
<html>
<head>
<title>Voting System</title>

<style>
body {
    font-family: Arial;
    background: #eaf2f8;
    margin: 0;
    padding: 20px;
}

.container {
    background: white;
    max-width: 500px;
    margin: 30px auto;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 4px 15px #ccc;
}

h1 {
    text-align: center;
    color: #164b85;
    font-size: 30px;
}

h3 {
    text-align: center;
}

.candidate {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 15px 5px;
    border-bottom: 1px solid #ddd;
    gap: 10px;
}

.candidate label {
    flex: 1;
    font-size: 16px;
}

.count {
    background: #e3f0ff;
    color: #0755a0;
    padding: 8px 12px;
    border-radius: 8px;
    font-weight: bold;
    white-space: nowrap;
}

button {
    background: #1877d2;
    color: white;
    border: none;
    padding: 14px;
    width: 100%;
    border-radius: 8px;
    font-size: 18px;
    margin-top: 20px;
}

button:disabled {
    background: gray;
}

.results {
    background: #f0f7ff;
    padding: 15px;
    margin-top: 20px;
    border-radius: 10px;
    text-align: center;

  .author {
    text-align: center;
    color: #1877d2;
    font-size: 17px;
    font-weight: bold;
    margin-top: -10px;
    margin-bottom: 30px;

}

</style>
</head>

<body>

<div class="container">

<h1>VOTING SYSTEM</h1> 
<p class="author">By Nim'aan Abdilahi Abbi</p>
  
<h3>Dooro Musharraxa Aad Taageerayso</h3>

<div class="candidate">
<label>
<input type="radio" name="candidate" value="0">
Maxamed Kaahin Axmed
</label>
<span class="count" id="count0">0</span>
</div>

<div class="candidate">
<label>
<input type="radio" name="candidate" value="1">
Clraxmaan Maxamed Cllaahi Ciro
</label>
<span class="count" id="count1">0</span>
</div>

<div class="candidate">
<label>
<input type="radio" name="candidate" value="2">
Maxamuud Xaashi Cabdi
</label>
<span class="count" id="count2">0</span>
</div>

<div class="candidate">
<label>
<input type="radio" name="candidate" value="3">
Midnaba
</label>
<span class="count" id="count3">0</span>
</div>

<button id="voteButton" onclick="vote()">
COD BIXI
</button>

<div class="results">
<h3>TIRADA CODADKA</h3>
<h2 id="total">Wadarta: 0</h2>
<p id="message">Weli cod lama dhiiban.</p>
</div>

</div>

<script>

let votes = [0, 0, 0, 0];

function vote() {

if (localStorage.getItem("hasVoted")) {
alert("Waxaad hore u dhiibatay codkaaga!");
return;
}

let selected = document.querySelector(
'input[name="candidate"]:checked'
);

if (!selected) {
alert("Fadlan dooro musharrax!");
return;
}

let index = Number(selected.value);

votes[index]++;

localStorage.setItem("hasVoted", "true");

updateResults();

document.getElementById("message").innerText =
"Waad ku mahadsan tahay codkaaga!";

document.getElementById("voteButton").disabled = true;

}

function updateResults() {

let total = 0;

for (let i = 0; i < votes.length; i++) {

document.getElementById("count" + i).innerText =
votes[i] + " Cod";

total += votes[i];

}

document.getElementById("total").innerText =
"Wadarta: " + total;

}

updateResults();

</script>

</body>
</html>
